spring.application.name=expense-tracker-web
server.port=8080

# Filled in from environment variables (set these in Render's dashboard,
# never commit real values here). Locally, you can set them in your
# terminal before running, or in a .env-style tool of your choice.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Auto-creates/updates tables from the @Entity classes on startup -
# fine for a student project, not a substitute for real migrations
# on a production system.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
